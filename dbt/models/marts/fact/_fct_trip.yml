version: 2

models:
  - name: fct_trip
    description: >
      Fact table of the star schema. Grain: one completed taxi trip, that is one row of
      a monthly TLC file. Every silver row is kept with its quality status; approved
      metrics use quality_status = 'valid'.
    columns:
      - name: trip_sk
        description: >
          Surrogate key, deterministic and readable: YYYYMM of the source file followed
          by the 0-based row number in that file on 8 digits (20250100001204 = row 1204
          of the 2025-01 file).
        data_tests: [unique, not_null]
      - name: pickup_date_sk
        description: Pickup date (YYYYMMDD), -1 when missing or outside the calendar.
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_date'), field: date_sk}
      - name: pickup_time_sk
        description: Pickup minute of the day (HHMM), -1 when missing.
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_time'), field: time_sk}
      - name: pickup_zone_sk
        description: Pickup zone, -1 when the zone id is missing.
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_pickup_zone'), field: pickup_zone_sk}
      - name: dropoff_zone_sk
        description: Dropoff zone, -1 when the zone id is missing.
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_dropoff_zone'), field: dropoff_zone_sk}
      - name: payment_type_sk
        description: Payment type, -1 when the code is missing or unknown.
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_payment_type'), field: payment_type_sk}
      - name: rate_code_sk
        description: Rate code, -1 when unknown, -2 when not reported by the vendor.
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_rate_code'), field: rate_code_sk}
      - name: vendor_sk
        description: Vendor, -1 when the code is missing or unknown.
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_vendor'), field: vendor_sk}
      - name: service_period_sk
        description: Service period of the pickup (AM peak, PM peak, late night, off-peak).
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_service_period'), field: service_period_sk}
      - name: trip_quality_sk
        description: Combination of quality flags raised on the trip.
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_trip_quality'), field: trip_quality_sk}
      - name: source_month
        description: Month of the source file (degenerate identifier).
        data_tests: [not_null]
      - name: file_row_number
        description: 0-based row number in the source file (degenerate identifier).
        data_tests: [not_null]
      - name: batch_id
        description: Ingestion batch that loaded the trip (ops.ingestion_manifest).
        data_tests: [not_null]
      - name: total_amount
        description: Total charged to the passenger in USD. The governed revenue measure.
      - name: is_airport_trip
        description: Pickup or dropoff at EWR, JFK or LGA, or a JFK / Newark rate code.
      - name: is_tip_recorded
        description: True for card payments, the only ones for which tips are recorded.
      - name: quality_status
        description: valid, suspicious or invalid.
        data_tests:
          - accepted_values:
              arguments:
                values: [valid, suspicious, invalid]
