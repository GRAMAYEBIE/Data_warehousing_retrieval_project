version: 2

models:
  - name: dim_date
    description: Calendar day with weekend and public-holiday attributes. -1 is the Unknown member.
    columns:
      - name: date_sk
        description: Date as YYYYMMDD.
        data_tests: [unique, not_null]
      - name: day_type
        description: Weekday, Weekend or Public holiday.
        data_tests:
          - accepted_values:
              arguments:
                values: [Weekday, Weekend, "Public holiday", Unknown]

  - name: dim_time
    description: Minute of the day with hour and day part. -1 is the Unknown member.
    columns:
      - name: time_sk
        description: Minute of the day as HHMM.
        data_tests: [unique, not_null]

  - name: dim_zone
    description: >
      TLC taxi zone with borough, airport flag and market segment. is_manhattan_core is
      a proxy (Manhattan zones of the "Yellow Zone" service zone). -1 is the Unknown member.
    columns:
      - name: zone_sk
        description: Zone key (the TLC LocationID, or -1).
        data_tests: [unique, not_null]

  - name: dim_pickup_zone
    description: Role-playing view of dim_zone for the pickup location.
    columns:
      - name: pickup_zone_sk
        description: Pickup zone key.
        data_tests: [unique, not_null]

  - name: dim_dropoff_zone
    description: Role-playing view of dim_zone for the dropoff location.
    columns:
      - name: dropoff_zone_sk
        description: Dropoff zone key.
        data_tests: [unique, not_null]

  - name: dim_payment_type
    description: TLC payment types. Tips are recorded for card payments only.
    columns:
      - name: payment_type_sk
        description: Payment type key.
        data_tests: [unique, not_null]

  - name: dim_rate_code
    description: TLC rate codes, with Unknown (-1) and Not reported (-2) members.
    columns:
      - name: rate_code_sk
        description: Rate code key.
        data_tests: [unique, not_null]

  - name: dim_vendor
    description: Technology providers that report the trips.
    columns:
      - name: vendor_sk
        description: Vendor key.
        data_tests: [unique, not_null]

  - name: dim_service_period
    description: Service periods for capacity analysis (peak and off-peak).
    columns:
      - name: service_period_sk
        description: Service period key.
        data_tests: [unique, not_null]

  - name: dim_trip_quality
    description: >
      Junk dimension with one row per combination of quality flags observed in silver,
      its status and one boolean per flag.
    columns:
      - name: trip_quality_sk
        description: Hash of the flag list.
        data_tests: [unique, not_null]
