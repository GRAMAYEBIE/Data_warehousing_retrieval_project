name: nyc_taxi
version: "1.0.0"
config-version: 2
profile: nyc_taxi

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

clean-targets: ["target", "dbt_packages"]

# Airflow installs the packages once in its image (/opt/dbt_packages) and points dbt there:
# copying them from the mounted project folder before each Cosmos task took about two
# minutes per task. Outside Airflow the default local folder is used.
packages-install-path: "{{ env_var('DBT_PACKAGES_INSTALL_PATH', 'dbt_packages') }}"

vars:
  # Quality thresholds (see macros/quality_flags.sql for the flag catalogue).
  cross_month_tolerance_days: 3
  max_speed_mph: 80
  max_distance_miles: 200
  min_duration_minutes: 1
  max_duration_minutes: 360
  amount_tolerance: 0.05
  unknown_zone_ids: [264, 265]
  known_payment_types: [0, 1, 2, 3, 4, 5, 6]
  known_rate_codes: [1, 2, 3, 4, 5, 6]
  # Airport zones: 1 Newark (EWR), 132 JFK, 138 LaGuardia. Airport rate codes: 2 JFK, 3 Newark.
  airport_zone_ids: [1, 132, 138]
  airport_rate_codes: [2, 3]
  # Calendar covered by dim_date: the loaded months plus the cross-month tolerance, and the
  # months to come. A valid trip dated outside it fails assert_valid_trips_have_a_calendar_date
  # (first set to January 2026: months loaded later lost their date until the test existed).
  calendar_start: "2024-11-01"
  calendar_end: "2027-12-31"
  # Optional list of source months to (re)process, e.g. --vars '{months: ["2025-01-01"]}'.
  # Empty: process every month whose latest loaded batch is not in silver yet.
  months: []
  # Months the tests of the trip tables read (macros/test_scope.sql): "YYYY-MM", the month
  # a run loads (set by the Airflow DAG); "", the latest loaded month; "all", every month.
  test_month: ""

models:
  nyc_taxi:
    staging:
      +schema: silver
      +materialized: view
    intermediate:
      +schema: silver
      +materialized: table
    marts:
      +schema: gold
      +materialized: table
    semantic:
      +schema: gold

seeds:
  nyc_taxi:
    +schema: silver

# Tests of the trip tables (bronze, silver, fact) read the months a run changed, not the
# whole history: see macros/test_scope.sql and the variable test_month above.
