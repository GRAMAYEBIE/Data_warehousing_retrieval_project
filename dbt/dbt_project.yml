name: nyc_taxi
version: "1.0.0"
config-version: 2
profile: nyc_taxi

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

clean-targets: ["target", "dbt_packages"]

# Airflow installs the packages once in its image (/opt/dbt_packages) and points dbt there:
# copying them from the mounted project folder before each Cosmos task took about two
# minutes per task. Outside Airflow the default local folder is used.
packages-install-path: "{{ env_var('DBT_PACKAGES_INSTALL_PATH', 'dbt_packages') }}"

vars:
  # Quality thresholds (see macros/quality_flags.sql for the flag catalogue).
  cross_month_tolerance_days: 3
  max_speed_mph: 80
  max_distance_miles: 200
  min_duration_minutes: 1
  max_duration_minutes: 360
  amount_tolerance: 0.05
  unknown_zone_ids: [264, 265]
  known_payment_types: [0, 1, 2, 3, 4, 5, 6]
  known_rate_codes: [1, 2, 3, 4, 5, 6]
  # Airport zones: 1 Newark (EWR), 132 JFK, 138 LaGuardia. Airport rate codes: 2 JFK, 3 Newark.
  airport_zone_ids: [1, 132, 138]
  airport_rate_codes: [2, 3]
  # Calendar covered by dim_date: the loaded months plus the cross-month tolerance.
  calendar_start: "2024-11-01"
  calendar_end: "2026-01-31"
  # Optional list of source months to (re)process, e.g. --vars '{months: ["2025-01-01"]}'.
  # Empty: process every month whose latest loaded batch is not in silver yet.
  months: []

models:
  nyc_taxi:
    staging:
      +schema: silver
      +materialized: view
    intermediate:
      +schema: silver
      +materialized: table
    marts:
      +schema: gold
      +materialized: table
    semantic:
      +schema: gold

seeds:
  nyc_taxi:
    +schema: silver

# Tests of the two largest tables check the latest loaded month and the month before it:
# the months a monthly run rebuilds (a new month also re-evaluates its neighbour for
# cross-month duplicates). The bound comes from the small ingestion manifest and matches
# the leading column of an index, so a test reads two months instead of the history.
# (A first version compared a load timestamp with max() over the whole table, without
# index, in every test: the fct_trip tests took more than an hour and a half.)
# Uniqueness across months holds by construction (the key starts with the source month).
# A backfill of an older month is tested by running dbt test without these filters.
data_tests:
  nyc_taxi:
    # fct_trip keys depend only on the month itself (the neighbour is rebuilt for
    # cross-month duplicates, which are tested in silver): test the latest month only.
    marts:
      fact:
        +where: >-
          source_month = (select max(source_month) from ops.ingestion_manifest
          where dataset = 'yellow' and status = 'loaded')
    intermediate:
      trips:
        +where: >-
          source_month >= (select max(source_month) from ops.ingestion_manifest
          where dataset = 'yellow' and status = 'loaded') - interval '1 month'
