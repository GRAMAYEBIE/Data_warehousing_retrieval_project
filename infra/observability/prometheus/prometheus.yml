# Prometheus: metrics of every layer of the platform (profile observability).
# Each job is one place where something can go wrong; the "layer" label groups them on the
# overview dashboard (source -> storage -> warehouse -> orchestration -> BI -> AI -> host).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"], labels: {layer: observability}}]

  # Host and containers: CPU, memory, swap, disk, restarts, out-of-memory kills.
  - job_name: node
    static_configs: [{targets: ["node-exporter:9100"], labels: {layer: host}}]
  - job_name: cadvisor
    scrape_interval: 60s
    static_configs: [{targets: ["cadvisor:8080"], labels: {layer: host}}]

  # Warehouse: connections, locks, slow queries, database sizes, and the pipeline state read
  # from the ops tables (custom queries in postgres-exporter/queries.yml).
  - job_name: postgres
    scrape_interval: 60s
    static_configs: [{targets: ["postgres-exporter:9187"], labels: {layer: warehouse}}]

  # Orchestration and BI: Airflow and Superset send StatsD, translated by statsd-exporter.
  - job_name: statsd
    static_configs: [{targets: ["statsd-exporter:9102"], labels: {layer: orchestration}}]
  - job_name: redis
    static_configs: [{targets: ["redis-exporter:9121"], labels: {layer: bi}}]

  # AI assistant: answers, verdicts, step durations, model tokens (assistant/metrics.py).
  - job_name: assistant
    metrics_path: /metrics
    static_configs: [{targets: ["api:8000"], labels: {layer: ai}}]

  # The observability stack itself.
  - job_name: loki
    static_configs: [{targets: ["loki:3100"], labels: {layer: observability}}]
  - job_name: tempo
    static_configs: [{targets: ["tempo:3200"], labels: {layer: observability}}]
  - job_name: alloy
    static_configs: [{targets: ["alloy:12345"], labels: {layer: observability}}]
  - job_name: grafana
    static_configs: [{targets: ["grafana:3000"], labels: {layer: observability}}]
