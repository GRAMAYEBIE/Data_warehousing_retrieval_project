# Dashboards as code: generated by infra/observability/grafana/build_dashboards.py into
# infra/observability/grafana/dashboards/ and loaded here (read-only in the UI).
apiVersion: 1

providers:
  - name: nyc-taxi-insight-hub
    folder: NYC Taxi Insight Hub
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
