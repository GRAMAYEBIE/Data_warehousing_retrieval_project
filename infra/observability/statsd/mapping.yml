# StatsD -> Prometheus names for Airflow and Superset (both send StatsD).
# Timers become histograms in seconds.
defaults:
  observer_type: histogram
  histogram_options:
    buckets: [1, 5, 15, 30, 60, 120, 300, 600, 1800, 3600, 7200, 14400]

mappings:
  # Airflow: runs, tasks, scheduler, DAG parsing.
  - match: "airflow.dagrun.duration.*.*"
    name: airflow_dagrun_duration_seconds
    labels: {outcome: "${1}", dag_id: "${2}"}
  - match: "airflow.dag.*.*.duration"
    name: airflow_task_duration_seconds
    labels: {dag_id: "${1}", task_id: "${2}"}
  - match: "airflow.ti.finish.*.*.*"
    name: airflow_task_finished_total
    labels: {dag_id: "${1}", task_id: "${2}", state: "${3}"}
  - match: "airflow.ti_failures"
    name: airflow_task_failures_total
  - match: "airflow.scheduler_heartbeat"
    name: airflow_scheduler_heartbeat_total
  - match: "airflow.dag_processing.import_errors"
    name: airflow_dag_import_errors
  - match: "airflow.dag_processing.total_parse_time"
    name: airflow_dag_parse_seconds
  - match: "airflow.executor.*"
    name: airflow_executor_${1}
  - match: "airflow.pool.*.*"
    name: airflow_pool_${1}
    labels: {pool: "${2}"}
  # Superset: API and dashboard events, timed requests.
  - match: "superset.*.*"
    name: superset_${1}
    labels: {event: "${2}"}
  - match: "superset.*"
    name: superset_${1}
