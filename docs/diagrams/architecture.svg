<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1020" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <title>NYC Taxi Insight Hub architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#44536a"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3aa76d"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #9aa8bc; stroke-width: 1.3; }
      .layer { fill: #f4f6f9; stroke: #c5cfdc; stroke-width: 1.1; }
      .gate { fill: #fff8e1; stroke: #f2b705; stroke-width: 1.8; }
      .ai { fill: #eef5ff; stroke: #4c8fe0; stroke-width: 1.3; }
      .ext { fill: #f3fbf6; stroke: #3aa76d; stroke-width: 1.3; stroke-dasharray: 6 4; }
      .t { fill: #16202e; font-weight: 700; font-size: 16px; }
      .s { fill: #2f3c4f; font-size: 13.5px; }
      .h { fill: #16202e; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; }
      .ln { stroke: #44536a; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .dl { stroke: #3aa76d; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; marker-end: url(#g); }
    </style>
  </defs>

  <!-- Orchestration -->
  <rect class="layer" x="20" y="6" width="760" height="78" rx="10"/>
  <text class="h" x="36" y="28">ORCHESTRATION · AIRFLOW 3 + COSMOS (MONTHLY, ON THE 3RD)</text>
  <text class="s" x="36" y="50">check source → land → load bronze → dbt build and tests → quality gate</text>
  <text class="s" x="36" y="70">→ publish → refresh dashboards → notify; then the forecast DAG</text>

  <!-- Sources and landing -->
  <text class="h" x="22" y="102">SOURCES</text>
  <rect class="box" x="20" y="110" width="350" height="104" rx="8"/>
  <text class="t" x="36" y="136">TLC Yellow Taxi files</text>
  <text class="s" x="36" y="158">one Parquet file per month</text>
  <text class="s" x="36" y="177">+ taxi zone lookup (265 zones)</text>
  <text class="s" x="36" y="196">+ US / New York holidays (dbt seed)</text>
  <text class="h" x="432" y="102">LANDING</text>
  <rect class="box" x="430" y="110" width="350" height="104" rx="8"/>
  <text class="t" x="446" y="136">RustFS (S3 object store)</text>
  <text class="s" x="446" y="158">raw/yellow/year=YYYY/month=MM/</text>
  <text class="s" x="446" y="177">checksum, size, contract, schema drift</text>
  <text class="s" x="446" y="196">manifest of every load (ops schema)</text>
  <path class="ln" d="M370,162 L428,162"/>

  <!-- Warehouse -->
  <text class="h" x="240" y="248">POSTGRESQL WAREHOUSE · ELT WITH DBT</text>
  <rect class="layer" x="20" y="254" width="760" height="330" rx="12"/>
  <path class="ln" d="M605,214 L605,226 L140,226 L140,272"/>
  <rect class="box" x="40" y="274" width="220" height="84" rx="8"/>
  <text class="t" x="56" y="300">Bronze</text>
  <text class="s" x="56" y="322">raw rows as received,</text>
  <text class="s" x="56" y="341">one partition per month</text>
  <rect class="box" x="290" y="274" width="220" height="84" rx="8"/>
  <text class="t" x="306" y="300">Silver</text>
  <text class="s" x="306" y="322">typed and cleaned,</text>
  <text class="s" x="306" y="341">14 quality flags, status</text>
  <rect class="box" x="540" y="274" width="220" height="84" rx="8"/>
  <text class="t" x="556" y="300">Gold</text>
  <text class="s" x="556" y="322">star schema (fct_trip)</text>
  <text class="s" x="556" y="341">+ additive aggregates</text>
  <path class="ln" d="M260,316 L288,316"/>
  <path class="ln" d="M510,316 L538,316"/>

  <rect class="gate" x="40" y="378" width="720" height="44" rx="8"/>
  <text class="t" x="56" y="406">Publication gate: published only if every dbt test and signal passes</text>
  <path class="ln" d="M650,358 L650,376"/>

  <rect class="box" x="40" y="444" width="340" height="122" rx="8"/>
  <text class="t" x="56" y="470">Analytics (published layer)</text>
  <text class="s" x="56" y="492">copy of the approved gold tables</text>
  <text class="s" x="56" y="511">+ BI views, swapped in one transaction:</text>
  <text class="s" x="56" y="530">the only layer users and the AI read</text>
  <text class="s" x="56" y="549">(roles superset_reader, ai_reader)</text>
  <rect class="box" x="420" y="444" width="340" height="122" rx="8"/>
  <text class="t" x="436" y="470">Semantic layer</text>
  <text class="s" x="436" y="492">15 governed metrics defined once in</text>
  <text class="s" x="436" y="511">dbt YAML (MetricFlow): formula,</text>
  <text class="s" x="436" y="530">filters, owner, grains; copied to</text>
  <text class="s" x="436" y="549">Superset and the AI, never rewritten</text>
  <path class="ln" d="M210,422 L210,442"/>
  <path class="ln" d="M380,505 L418,505"/>

  <!-- Users -->
  <text class="h" x="22" y="616">USERS</text>
  <path class="ln" d="M140,566 L140,622"/>
  <path class="ln" d="M590,566 L590,594 L400,594 L400,622"/>
  <path class="ln" d="M590,594 L660,594 L660,622"/>
  <rect class="box" x="20" y="624" width="240" height="122" rx="8"/>
  <text class="t" x="36" y="650">Superset</text>
  <text class="s" x="36" y="672">six dashboards, certified</text>
  <text class="s" x="36" y="691">datasets, row-level security,</text>
  <text class="s" x="36" y="710">"so what" insight on each</text>
  <rect class="ai" x="280" y="624" width="240" height="122" rx="8"/>
  <text class="t" x="296" y="650">AI assistant (FastAPI)</text>
  <text class="s" x="296" y="672">qwen2.5:7b (Ollama) plans</text>
  <text class="s" x="296" y="691">and explains; code validates,</text>
  <text class="s" x="296" y="710">runs approved SQL, checks</text>
  <text class="s" x="296" y="729">every figure; Superset drafts</text>
  <rect class="box" x="540" y="624" width="240" height="122" rx="8"/>
  <text class="t" x="556" y="650">Web interface (React)</text>
  <text class="s" x="556" y="672">Overview, Forecast,</text>
  <text class="s" x="556" y="691">Shift planner, Ask a</text>
  <text class="s" x="556" y="710">question, Report builder</text>
  <path class="ln" d="M520,685 L538,685"/>

  <!-- Extensions -->
  <text class="h" x="22" y="776">EXTENSIONS</text>
  <rect class="ext" x="20" y="784" width="240" height="112" rx="8"/>
  <text class="t" x="36" y="810">Demand forecast</text>
  <text class="s" x="36" y="832">baseline vs LightGBM on</text>
  <text class="s" x="36" y="851">rolling backtests (MLflow);</text>
  <text class="s" x="36" y="870">checked against actual</text>
  <rect class="ext" x="280" y="784" width="240" height="112" rx="8"/>
  <text class="t" x="296" y="810">Streaming (Kafka)</text>
  <text class="s" x="296" y="832">current month as events;</text>
  <text class="s" x="296" y="851">contract, dead letters;</text>
  <text class="s" x="296" y="870">provisional rows only</text>
  <rect class="ext" x="540" y="784" width="240" height="112" rx="8"/>
  <text class="t" x="556" y="810">Observability</text>
  <text class="s" x="556" y="832">Prometheus, Grafana, Loki,</text>
  <text class="s" x="556" y="851">Tempo: pipeline, quality,</text>
  <text class="s" x="556" y="870">every AI answer; 12 alerts</text>
  <path class="dl" d="M660,784 L660,748"/>

  <!-- Delivery and security -->
  <rect class="layer" x="20" y="914" width="760" height="98" rx="10"/>
  <text class="h" x="36" y="938">DELIVERY AND SECURITY</text>
  <text class="s" x="36" y="961">Docker Compose with profiles, health checks, persistent volumes; secrets only in .env</text>
  <text class="s" x="36" y="981">Least-privilege roles: loader, transformer, publisher, superset_reader, ai_reader,</text>
  <text class="s" x="36" y="1001">ai_audit_writer, forecaster, streamer · every AI answer audited</text>
</svg>
