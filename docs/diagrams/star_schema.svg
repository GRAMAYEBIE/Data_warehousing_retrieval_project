<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">
  <title>Star schema: one row of fct_trip per completed taxi trip</title>
  <defs>
    <style>
      .dim { fill: #ffffff; stroke: #9aa8bc; stroke-width: 1.2; rx: 7; }
      .ext { fill: #ffffff; stroke: #9aa8bc; stroke-width: 1.2; rx: 7; stroke-dasharray: 5 3; }
      .fact { fill: #fff8e1; stroke: #f2b705; stroke-width: 2; rx: 9; }
      .hd { fill: #16202e; rx: 7; }
      .ht { fill: #ffffff; font-weight: 700; font-size: 12px; }
      .k { fill: #16202e; font-weight: 600; }
      .s { fill: #44536a; }
      .ln { stroke: #9aa8bc; stroke-width: 1.3; }
    </style>
  </defs>

  <!-- links (drawn first) -->
  <path class="ln" d="M500,235 L150,70"/>
  <path class="ln" d="M500,235 L500,62"/>
  <path class="ln" d="M500,235 L850,70"/>
  <path class="ln" d="M500,235 L150,235"/>
  <path class="ln" d="M500,235 L850,235"/>
  <path class="ln" d="M500,235 L150,400"/>
  <path class="ln" d="M500,235 L500,420"/>
  <path class="ln" d="M500,235 L850,400"/>

  <!-- fact -->
  <rect class="fact" x="370" y="132" width="260" height="214"/>
  <text class="k" x="384" y="154" font-size="13">fct_trip</text>
  <text class="s" x="384" y="170">grain: one completed trip (row of a monthly file)</text>
  <text class="k" x="384" y="190">trip_sk  (YYYYMM + row number, deterministic)</text>
  <text class="s" x="384" y="206">source_month, file_row_number, batch_id</text>
  <text class="s" x="384" y="222">date_sk, pickup_time_sk, pickup_zone_sk,</text>
  <text class="s" x="384" y="236">dropoff_zone_sk, payment_type_sk, rate_code_sk,</text>
  <text class="s" x="384" y="250">vendor_sk, service_period_sk, trip_quality_sk</text>
  <text class="s" x="384" y="268">fare, extra, mta_tax, tip, tolls, surcharges,</text>
  <text class="s" x="384" y="282">airport_fee, cbd_congestion_fee, total_amount,</text>
  <text class="s" x="384" y="296">distance, duration_min, speed_mph, passengers</text>
  <text class="k" x="384" y="316">quality_status, quality_flags, is_airport_trip</text>
  <text class="s" x="384" y="334">incremental by source month · partitioned</text>

  <!-- required dimensions -->
  <rect class="dim" x="60" y="22" width="190" height="66"/>
  <rect class="hd" x="60" y="22" width="190" height="22"/><text class="ht" x="70" y="38">dim_date</text>
  <text class="s" x="70" y="58">date, weekday, week, month,</text>
  <text class="s" x="70" y="73">is_weekend, is_holiday, holiday</text>

  <rect class="dim" x="405" y="14" width="190" height="56"/>
  <rect class="hd" x="405" y="14" width="190" height="22"/><text class="ht" x="415" y="30">dim_time</text>
  <text class="s" x="415" y="50">minute of the day, hour</text>
  <text class="s" x="415" y="63">(time of pickup)</text>

  <rect class="dim" x="750" y="22" width="200" height="66"/>
  <rect class="hd" x="750" y="22" width="200" height="22"/><text class="ht" x="760" y="38">dim_pickup_zone</text>
  <text class="s" x="760" y="58">zone, borough, service zone,</text>
  <text class="s" x="760" y="73">is_airport, is_manhattan_core</text>

  <rect class="dim" x="50" y="200" width="200" height="66"/>
  <rect class="hd" x="50" y="200" width="200" height="22"/><text class="ht" x="60" y="216">dim_payment_type</text>
  <text class="s" x="60" y="236">card, cash, no charge, dispute,</text>
  <text class="s" x="60" y="251">Unknown (-1)</text>

  <rect class="dim" x="750" y="200" width="200" height="66"/>
  <rect class="hd" x="750" y="200" width="200" height="22"/><text class="ht" x="760" y="216">dim_dropoff_zone</text>
  <text class="s" x="760" y="236">role-playing view of dim_zone</text>
  <text class="s" x="760" y="251">(same 265 zones)</text>

  <rect class="dim" x="50" y="370" width="200" height="66"/>
  <rect class="hd" x="50" y="370" width="200" height="22"/><text class="ht" x="60" y="386">dim_rate_code</text>
  <text class="s" x="60" y="406">standard, JFK, Newark, ...,</text>
  <text class="s" x="60" y="421">Unknown (-1), Not reported (-2)</text>

  <!-- extensions -->
  <rect class="ext" x="405" y="392" width="190" height="62"/>
  <rect class="hd" x="405" y="392" width="190" height="22"/><text class="ht" x="415" y="408">dim_service_period</text>
  <text class="s" x="415" y="428">AM peak, PM peak, late night,</text>
  <text class="s" x="415" y="443">off-peak (extension)</text>

  <rect class="ext" x="750" y="362" width="200" height="82"/>
  <rect class="hd" x="750" y="362" width="200" height="22"/><text class="ht" x="760" y="378">dim_vendor · dim_trip_quality</text>
  <text class="s" x="760" y="398">vendor names; combinations of</text>
  <text class="s" x="760" y="413">quality flags (junk dimension)</text>
  <text class="s" x="760" y="430">(extensions)</text>
</svg>
