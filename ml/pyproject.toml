[project]
name = "forecasting"
version = "0.1.0"
description = "Demand forecast of recorded taxi trips per pickup zone and hour, tracked in MLflow"
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.6,<5",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "psycopg[binary]>=3.2,<4",
    "mlflow-skinny>=3.17,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
