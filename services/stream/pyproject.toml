[project]
name = "stream"
version = "0.1.0"
description = "Provisional trips of the current month through Kafka (replay producer, consumer)"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.6,<3",
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2,<4",
    "pyarrow>=18,<22",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
