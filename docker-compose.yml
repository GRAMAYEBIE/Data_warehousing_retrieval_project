name: nyc-taxi-insight-hub

# Profiles: core (warehouse + landing zone), orchestration (Airflow), tools (one-shot jobs).
# Later waves add: bi, ai, observability, ml (MLflow + demand forecast), stream.

x-superset-env: &superset-env
  SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
  SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD}
  SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
  METRICS_STATSD_ON: ${METRICS_STATSD_ON:-true}
  REDIS_HOST: redis

x-airflow-common: &airflow-common
  image: nyc-taxi-airflow:local
  build:
    context: .
    dockerfile: airflow/Dockerfile
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow_meta
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
    AIRFLOW__CORE__PARALLELISM: "4"
    # Small machine: give task workers time to reach the API server under load (default
    # 5 s), and re-parse the Cosmos DAG every 5 minutes instead of every 30 seconds.
    AIRFLOW__WORKERS__EXECUTION_API_TIMEOUT: "60"
    AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: "300"
    # A task worker parses the DAG file before running; under load this took more than
    # the default 30 s and the task was rescheduled (17 minutes lost on one task).
    AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "120"
    AIRFLOW__DAG_PROCESSOR__DAG_FILE_PROCESSOR_TIMEOUT: "180"
    # A long silver build was declared lost after the scheduler stalled for 137 s under
    # load (default 300 s task timeout, 30 s health threshold). Tolerate slow heartbeats.
    AIRFLOW__SCHEDULER__TASK_INSTANCE_HEARTBEAT_TIMEOUT: "1200"
    AIRFLOW__SCHEDULER__SCHEDULER_HEALTH_CHECK_THRESHOLD: "120"
    PIPELINE_MAX_ACTIVE_TASKS: ${PIPELINE_MAX_ACTIVE_TASKS:-1}
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_passwords.json
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    # Warehouse connection used by the pipeline tasks (role publisher).
    AIRFLOW_CONN_WAREHOUSE_PUBLISHER: postgresql://publisher:${PUBLISHER_PASSWORD}@postgres:5432/${POSTGRES_DB}
    # dbt runs as transformer (dbt/profiles.yml reads these variables).
    DBT_PROJECT_DIR: /opt/airflow/dbt
    DBT_HOST: postgres
    DBT_PORT: "5432"
    DBT_DATABASE: ${POSTGRES_DB}
    DBT_USER: transformer
    DBT_PASSWORD: ${TRANSFORMER_PASSWORD}
    DBT_THREADS: "1"
    # Ingestion runs as loader.
    INGEST_PGHOST: postgres
    INGEST_PGPORT: "5432"
    INGEST_PGDATABASE: ${POSTGRES_DB}
    INGEST_PGUSER: loader
    INGEST_PGPASSWORD: ${LOADER_PASSWORD}
    S3_ENDPOINT_URL: http://rustfs:9000
    S3_ACCESS_KEY: ${S3_ACCESS_KEY}
    S3_SECRET_KEY: ${S3_SECRET_KEY}
    S3_BUCKET: ${S3_BUCKET}
    TLC_BASE_URL: ${TLC_BASE_URL}
    INGEST_BATCH_ROWS: ${INGEST_BATCH_ROWS:-200000}
    NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
    PIPELINE_SCHEDULE: ${PIPELINE_SCHEDULE:-}
    # Metrics of runs, tasks and the scheduler to Prometheus via statsd-exporter, which
    # starts with the core services (METRICS_STATSD_ON=false turns them off).
    AIRFLOW__METRICS__STATSD_ON: ${METRICS_STATSD_ON:-true}
    AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
    AIRFLOW__METRICS__STATSD_PORT: "9125"
    AIRFLOW__METRICS__STATSD_PREFIX: airflow
    # Superset refresh after each publication (task refresh_dashboards).
    SUPERSET_URL: http://superset:8088
    SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
    SUPERSET_READER_PASSWORD: ${SUPERSET_READER_PASSWORD}
    SUPERSET_AI_PASSWORD: ${SUPERSET_AI_PASSWORD:-}
    # Demand forecast DAG (profile ml): runs as forecaster, tracks in MLflow.
    FORECASTER_PASSWORD: ${FORECASTER_PASSWORD:-}
    MLFLOW_TRACKING_URI: http://mlflow:5000
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/include:/opt/airflow/include
    - ./dbt:/opt/airflow/dbt
    - ./services/metrics_sync:/opt/airflow/metrics_sync:ro
    - airflow_logs:/opt/airflow/logs
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy
    rustfs:
      condition: service_healthy

services:
  postgres:
    image: postgres:16.6
    profiles: [core]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      LOADER_PASSWORD: ${LOADER_PASSWORD}
      TRANSFORMER_PASSWORD: ${TRANSFORMER_PASSWORD}
      PUBLISHER_PASSWORD: ${PUBLISHER_PASSWORD}
      SUPERSET_READER_PASSWORD: ${SUPERSET_READER_PASSWORD}
      METRICS_READER_PASSWORD: ${METRICS_READER_PASSWORD}
      AI_READER_PASSWORD: ${AI_READER_PASSWORD}
      AI_AUDIT_WRITER_PASSWORD: ${AI_AUDIT_WRITER_PASSWORD}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD}
      FORECASTER_PASSWORD: ${FORECASTER_PASSWORD}
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD}
    command:
      - postgres
      - -c
      # pg_prewarm: the views the assistant and Superset read are loaded into shared_buffers
      # after a publication and reloaded automatically after a restart (autoprewarm), so a
      # question does not wait for the disk (observed: 11 s for a one-month total when the
      # model's 2.3 GB had pushed the data out of memory, beyond the assistant's 10 s limit).
      - shared_preload_libraries=pg_stat_statements,pg_prewarm
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_wal_size=4GB
      # Small host: one CPU per query and no JIT. Parallel workers saturated every core,
      # the Docker VM stalled ("soft lockup" in its kernel log) and backends were lost.
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - jit=off
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h localhost: the temporary server used while init scripts run listens on the
      # unix socket only, so the service is not reported healthy before init is finished.
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Let PostgreSQL finish its shutdown checkpoint after large loads; the default
    # 10 s leads to a kill and a long crash recovery on the next start.
    stop_grace_period: 2m
    # PostgreSQL keeps dynamic shared memory (hash tables and sorts that outgrow work_mem,
    # parallel index builds) in /dev/shm; Docker gives a container 64 MB. Observed on the
    # Mac mini: int_trips_flagged failed with "could not resize shared memory segment".
    shm_size: 1g
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.6
    profiles: [core]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${S3_API_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  ingestion:
    build: ./ingestion
    profiles: [tools]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: loader
      PGPASSWORD: ${LOADER_PASSWORD}
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      TLC_BASE_URL: ${TLC_BASE_URL}
      INGEST_BATCH_ROWS: ${INGEST_BATCH_ROWS:-200000}
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  dbt:
    build: ./dbt
    profiles: [tools]
    # Same user as Airflow: both write dbt/target and dbt/logs in the shared project folder.
    user: "50000:0"
    environment:
      DBT_HOST: postgres
      DBT_PORT: "5432"
      DBT_DATABASE: ${POSTGRES_DB}
      DBT_USER: transformer
      DBT_PASSWORD: ${TRANSFORMER_PASSWORD}
      DBT_THREADS: ${DBT_THREADS:-2}
    volumes:
      - ./dbt:/usr/app/dbt
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: migrate the Airflow database, set the admin password, build the dbt manifest
  # that Cosmos reads to render one Airflow task per dbt model.
  airflow-init:
    <<: *airflow-common
    profiles: [orchestration]
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        cd /opt/airflow/dbt
        /opt/dbt_venv/bin/dbt parse --quiet
        echo "airflow-init done"
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    profiles: [orchestration]
    # The admin password comes from .env; it is written where the auth manager reads it.
    command:
      - bash
      - -c
      - |
        python -c "import json, os; json.dump({'admin': os.environ['AIRFLOW_ADMIN_PASSWORD']}, open(os.environ['AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE'], 'w'))"
        exec airflow api-server
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    profiles: [orchestration]
    command: scheduler
    environment:
      <<: *airflow-env
      # Built-in health endpoint of the scheduler (port 8974): a light HTTP check.
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "True"
    healthcheck:
      # Not `airflow jobs check`: that starts a full Airflow CLI (about 100 MB, tens of
      # seconds under load). Observed: when it exceeded its timeout, Docker abandoned it
      # but the process kept running; more than 13 piled up and starved the scheduler.
      test: ["CMD", "curl", "-fsS", "http://localhost:8974/health"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow-common
    profiles: [orchestration]
    command: dag-processor
    healthcheck:
      # The DAG processor has no HTTP endpoint, so the check starts an Airflow CLI: rare
      # (every 5 minutes) and with time to finish, so checks never pile up (observed with a
      # 60 s interval and a 30 s timeout under load: abandoned checks kept running).
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --local || exit 1"]
      interval: 300s
      timeout: 180s
      retries: 3
      start_period: 300s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------- BI (profile bi)
  redis:
    image: redis:7.2-bookworm
    profiles: [bi]
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb",
              "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  superset-init:
    image: nyc-taxi-superset:local
    build: ./infra/superset
    profiles: [bi]
    environment:
      <<: *superset-env
      ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
    volumes:
      - ./infra/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    command:
      - bash
      - -c
      - |
        set -e
        superset db upgrade
        superset fab create-admin --username admin --firstname Data --lastname Team \
          --email admin@example.org --password "$${ADMIN_PASSWORD}" || true
        superset fab reset-password --username admin --password "$${ADMIN_PASSWORD}"
        superset init
        echo "superset-init done"
    entrypoint: []
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  superset:
    image: nyc-taxi-superset:local
    build: ./infra/superset
    profiles: [bi]
    environment:
      <<: *superset-env
      # One web worker on a small host; the default 60 s worker timeout killed it while
      # the first requests loaded the application during a dbt build (endless loading).
      SERVER_WORKER_AMOUNT: "1"
      SERVER_THREADS_AMOUNT: "8"
      GUNICORN_TIMEOUT: "300"
    volumes:
      - ./infra/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    depends_on:
      superset-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------- AI (profile ai)
  ollama:
    image: ollama/ollama:0.40.12
    profiles: [ai]
    environment:
      # Loading the model takes minutes on a laptop CPU: load it once and keep it.
      OLLAMA_KEEP_ALIVE: "-1"
      # Two cache slots: the planner and the narrator each keep their own system prompt
      # already read, so a question only reads its new tokens.
      OLLAMA_NUM_PARALLEL: "2"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # One-shot: download the model named in .env (skipped when already present), then load
  # it into memory so the first question does not wait for the load.
  ollama-pull:
    image: ollama/ollama:0.40.12
    profiles: [ai]
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    entrypoint: ["/bin/sh", "-c", "ollama pull \"$$MODEL\" && ollama run \"$$MODEL\" ready > /dev/null"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  api:
    image: nyc-taxi-assistant:local
    build: ./app/api
    profiles: [ai]
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      AI_READER_PASSWORD: ${AI_READER_PASSWORD}
      AI_AUDIT_WRITER_PASSWORD: ${AI_AUDIT_WRITER_PASSWORD}
      # The Ollama container by default. On macOS, Docker cannot use the Apple GPU: Ollama
      # installed on the host (Metal) is reached with OLLAMA_URL=http://host.docker.internal:11435
      # (see README, Windows and macOS).
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      PROMPT_VARIANT: ${PROMPT_VARIANT:-v3_structured_examples}
      OLLAMA_NUM_THREAD: ${OLLAMA_NUM_THREAD:-0}
      LLM_OUTPUT_MODE: ${LLM_OUTPUT_MODE:-free}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-1}
      ASSISTANT_RAG: ${ASSISTANT_RAG:-true}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-900}
      API_TOKEN: ${API_TOKEN}
      SUPERSET_URL: http://superset:8088
      SUPERSET_AI_USER: ai_builder
      SUPERSET_AI_PASSWORD: ${SUPERSET_AI_PASSWORD}
      # Traces to Tempo (profile observability); empty: traces are created, not sent.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: nyc-taxi-assistant
    ports:
      - "${API_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # the host's Ollama, also on Linux
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped

  # Web interface of the assistant (conversation and report builder). Bound to this machine
  # only: nginx holds the API token and adds it to the calls it forwards.
  web:
    image: nyc-taxi-web:local
    build: ./app/web
    profiles: [ai]
    environment:
      API_UPSTREAM: api:8000
      API_TOKEN: ${API_TOKEN}
      # Read by the browser at start-up (/config.json): no rebuild to change them.
      SUPERSET_PUBLIC_URL: ${SUPERSET_PUBLIC_URL:-http://localhost:8088}
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:3000}
      MLFLOW_PUBLIC_URL: ${MLFLOW_PUBLIC_URL:-http://localhost:5500}
      SHOW_PLATFORM_HEALTH: ${SHOW_PLATFORM_HEALTH:-false}
      SPEECH_UPSTREAM: speech:8001
    ports:
      - "127.0.0.1:${WEB_PORT:-8090}:80"
    depends_on: [api]
    restart: unless-stopped

  # Local speech-to-text for the microphone button (faster-whisper on the CPU). Reached
  # only by the web server on the internal network; the voice never leaves the machine.
  # The model (SPEECH_MODEL: tiny, base, small) is downloaded once into its volume.
  speech:
    image: nyc-taxi-speech:local
    build: ./app/speech
    profiles: [ai]
    environment:
      SPEECH_MODEL: ${SPEECH_MODEL:-base}
    volumes:
      - speech_models:/models
    mem_limit: 1500m
    restart: unless-stopped

  # ------------------------------------------------------------------ machine learning (ml)
  # MLflow tracking server: runs and the model registry in PostgreSQL (mlflow_meta), model
  # files in RustFS (bucket mlflow), served through the server. UI on MLFLOW_PORT (not 5000,
  # which macOS uses for AirPlay).
  mlflow:
    image: nyc-taxi-mlflow:local
    build: ./infra/mlflow
    profiles: [ml]
    environment:
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD}
      MLFLOW_BUCKET: ${MLFLOW_BUCKET:-mlflow}
      MLFLOW_S3_ENDPOINT_URL: http://rustfs:9000
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      # Background job workers serve MLflow's generative-AI features, unused here: about
      # 1.3 GB (seven workers of 220 MB) saved by turning them off.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    ports:
      - "${MLFLOW_PORT:-5500}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    mem_limit: 768m
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    restart: unless-stopped

  # Demand forecast job (one-shot): reads the published layer as forecaster, records the
  # run in MLflow, writes the ml schema. Airflow runs it after each publication; by hand:
  #   docker compose --profile ml run --rm --no-deps forecast [--dry-run]
  forecast:
    image: nyc-taxi-forecast:local
    build: ./ml
    profiles: [ml]
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: forecaster
      FORECASTER_PASSWORD: ${FORECASTER_PASSWORD}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    mem_limit: 3g
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    restart: "no"

  # ------------------------------------------------------------------ observability
  # Metrics (Prometheus, exporters, Alertmanager), logs (Loki, Alloy), traces (Tempo) and
  # one place to see them (Grafana, dashboards and data sources as code). Memory limits
  # keep the stack within about 1.3 GB on the development machine.
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver  # span metrics from Tempo
      - --enable-feature=exemplar-storage  # metric points link to their traces
    volumes:
      - ./infra/observability/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"  # no login: this machine only
    mem_limit: 300m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 20s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: [observability]
    command: [--config.file=/etc/alertmanager/alertmanager.yml, --storage.path=/alertmanager]
    volumes:
      - ./infra/observability/alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"  # no login: this machine only
    mem_limit: 64m
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    profiles: [observability]
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    mem_limit: 48m
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    profiles: [observability]
    privileged: true
    command: [--docker_only=true, --housekeeping_interval=30s, --store_container_labels=false]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    mem_limit: 160m
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    profiles: [observability]
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: metrics_reader
      DATA_SOURCE_PASS: ${METRICS_READER_PASSWORD}
    command: [--extend.query-path=/etc/postgres-exporter/queries.yml]
    volumes:
      - ./infra/observability/postgres-exporter:/etc/postgres-exporter:ro
    mem_limit: 64m
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.75.0
    profiles: [observability]
    environment:
      REDIS_ADDR: redis://redis:6379
    mem_limit: 32m
    restart: unless-stopped

  # Starts with the core services: Airflow and Superset resolve its name when they start,
  # so it must exist whenever they run (48 MB); Prometheus reads it when observability runs.
  statsd-exporter:
    image: prom/statsd-exporter:v0.28.0
    profiles: [core, observability]
    command: [--statsd.mapping-config=/etc/statsd/mapping.yml]
    volumes:
      - ./infra/observability/statsd:/etc/statsd:ro
    mem_limit: 48m
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.3
    profiles: [observability]
    command: [-config.file=/etc/loki/loki.yml]
    volumes:
      - ./infra/observability/loki:/etc/loki:ro
      - loki_data:/loki
    mem_limit: 256m
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.10.2
    profiles: [observability]
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      # No anonymous usage report to grafana.com: the platform sends nothing outside.
      - --disable-reporting
    environment:
      # Observed on a 10-core Mac: at 128 MB the Go garbage collector ran continuously on
      # every core (about 970 % CPU, 7 restarts). A memory target below the limit and two
      # threads keep the log collector a small, steady load whatever the host.
      GOMEMLIMIT: 200MiB
      GOMAXPROCS: "2"
    volumes:
      - ./infra/observability/alloy:/etc/alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 256m
    depends_on: [loki]
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.2
    profiles: [observability]
    user: "0"  # writes its blocks to the named volume
    command: [-config.file=/etc/tempo/tempo.yml]
    volumes:
      - ./infra/observability/tempo:/etc/tempo:ro
      - tempo_data:/var/tempo
    mem_limit: 256m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Administrators only: the login is asked again after 30 minutes of inactivity and
      # at least every 12 hours; no anonymous access.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_LOGIN_MAXIMUM_INACTIVE_LIFETIME_DURATION: 30m
      GF_AUTH_LOGIN_MAXIMUM_LIFETIME_DURATION: 12h
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_FEATURE_TOGGLES_ENABLE: traceToMetrics
      # Home page = "where is the problem?"; no internet news feed (offline deployment).
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/nyc-overview.json
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      METRICS_READER_PASSWORD: ${METRICS_READER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AIRFLOW_URL: http://localhost:${AIRFLOW_PORT:-8080}
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"  # administrators, on the server only
    mem_limit: 256m
    depends_on: [prometheus, loki, tempo]
    restart: unless-stopped

volumes:
  ollama_models:
  speech_models:
  airflow_logs:
  postgres_data:
  rustfs_data:
  prometheus_data:
  alertmanager_data:
  loki_data:
  tempo_data:
  grafana_data:
