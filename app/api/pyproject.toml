[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The package sits next to tests/: make it importable whatever the command (`pytest` in CI
# does not add the working directory to the import path; `python -m pytest` does).
pythonpath = ["."]
